name: MT5 Stress Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Backtest window length in days (ending at the last full day)"
        default: "30"
      model:
        description: "MT5 model: 4=real ticks, 1=every tick, 2=1 min OHLC"
        default: "4"
      execution_mode:
        description: "Simulated execution delay in ms (stress mode)"
        default: "15"
      tag:
        description: "Iteration tag used to name artifacts"
        default: "manual"
      symbol:
        description: "Override the auto-detected gold symbol (empty = auto-detect)"
        default: ""
      ea:
        description: "Expert file base name to test (no extension). Required."
        default: ""
      deposit:
        description: "Starting deposit in USD"
        default: "10"
      risk_pct:
        description: "Override InpMaxAccountRiskPct (empty = EA default)"
        default: ""
      max_positions:
        description: "Override InpMaxConcurrentPositions (empty = EA default)"
        default: ""
      spread_pts:
        description: "Force a fixed spread in points (empty = broker real spread)"
        default: ""
      extra_inputs:
        description: "Extra EA inputs, comma separated key=value"
        default: ""
      to_date:
        description: "End date yyyy-MM-dd (empty = yesterday), for month-by-month validation"
        default: ""
      set_file:
        description: "Optional .set file at repository root, applied as ExpertParameters"
        default: ""
      period:
        description: "Chart period for the test (M1, M5, M15, H1)"
        default: "M1"
      optimize:
        description: "0=off, 1=slow complete, 2=fast genetic"
        default: "0"
      opt_criterion:
        description: "MT5 OptimizationCriterion (12=custom max)"
        default: "12"
  push:
    branches:
      - main
      - "iter/**"
    paths:
      - "*.mq5"
      - "tools/**"
      - ".github/workflows/backtest.yml"

permissions:
  contents: read

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: false

env:
  INSTALLER_URL: https://download.mql5.com/cdn/web/just.global.markets/mt5/justmarkets5setup.exe
  EA_NAME: ${{ github.event.inputs.ea }}
  INPUT_RISK: ${{ github.event.inputs.risk_pct }}
  INPUT_POS: ${{ github.event.inputs.max_positions }}
  INPUT_EXTRA: ${{ github.event.inputs.extra_inputs }}
  SPREAD_PTS: ${{ github.event.inputs.spread_pts }}
  SET_FILE: ${{ github.event.inputs.set_file }}
  PERIOD: ${{ github.event.inputs.period || 'M1' }}
  MT5_DIR: C:\mt5

jobs:
  backtest:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate EA file
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EA_NAME)) {
            Write-Error "No EA given. Run with -f ea=<FileName> (file must exist at repository root as <FileName>.mq5)."
            exit 1
          }
          $src = Join-Path $env:GITHUB_WORKSPACE "$env:EA_NAME.mq5"
          $bin = Join-Path $env:GITHUB_WORKSPACE "$env:EA_NAME.ex5"
          if (-not (Test-Path $src) -and -not (Test-Path $bin)) {
            Write-Error "Neither $env:EA_NAME.mq5 nor $env:EA_NAME.ex5 found at the repository root."
            exit 1
          }
          if (Test-Path $src) { Write-Host "EA validated (source): $env:EA_NAME.mq5" }
          else { Write-Host "EA validated (pre-compiled): $env:EA_NAME.ex5" }

      - name: Validate required secrets
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:MT5_LOGIN))    { $missing += 'MT5_LOGIN' }
          if ([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) { $missing += 'MT5_PASSWORD' }
          if ([string]::IsNullOrWhiteSpace($env:MT5_SERVER))   { $missing += 'MT5_SERVER' }
          if ($missing.Count -gt 0) {
            Write-Error ("Missing repository secrets: " + ($missing -join ', ') + ". Add them under Settings > Secrets and variables > Actions.")
            exit 1
          }
          Write-Host "Credentials present (login length $($env:MT5_LOGIN.Length), server $($env:MT5_SERVER))"

      - name: Restore MT5 installation cache
        id: mt5cache
        uses: actions/cache@v4
        with:
          path: C:\mt5
          key: mt5-justmarkets-v2

      - name: Install JustMarkets MT5 (silent)
        if: steps.mt5cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'justmarkets5setup.exe'
          Write-Host "Downloading $env:INSTALLER_URL"
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installer -UseBasicParsing
          Write-Host "Installing silently"
          $p = Start-Process -FilePath $installer -ArgumentList '/auto' -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"

          $found = @()
          foreach ($root in @('C:\Program Files', 'C:\Program Files (x86)', $env:LOCALAPPDATA)) {
            if (Test-Path $root) {
              $found += Get-ChildItem -Path $root -Filter 'terminal64.exe' -Recurse -ErrorAction SilentlyContinue |
                        Where-Object { Test-Path (Join-Path $_.DirectoryName 'metaeditor64.exe') }
            }
          }
          if ($found.Count -eq 0) { Write-Error 'MT5 terminal64.exe not found after silent install.'; exit 1 }
          $src = $found[0].DirectoryName
          Write-Host "Detected MT5 install directory: $src"
          New-Item -ItemType Directory -Force -Path $env:MT5_DIR | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $env:MT5_DIR -Recurse -Force
          Get-ChildItem $env:MT5_DIR -Filter '*.exe' | Select-Object Name, Length | Format-Table

      # actions/cache only persists on job success, and a failed compile is
      # still a valid install. Save explicitly so iterations stay cheap.
      - name: Save MT5 installation cache
        if: always() && steps.mt5cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\mt5
          key: mt5-justmarkets-v2

      - name: Provision MQL5 standard library
        shell: pwsh
        run: |
          $target = Join-Path $env:MT5_DIR 'MQL5\Include'
          $probe  = Join-Path $target 'Trade\Trade.mqh'
          if (Test-Path $probe) { Write-Host 'standard library already present'; exit 0 }

          # A portable first run materialises the full MQL5 tree.
          $term = Join-Path $env:MT5_DIR 'terminal64.exe'
          if (Test-Path $term) {
            Start-Process -FilePath $term -ArgumentList '/portable' | Out-Null
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $probe) { break }
            }
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          if (Test-Path $probe) { Write-Host 'standard library created by terminal'; exit 0 }

          $sources = @()
          $sources += Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'MQL5\Include' }
          $sources += Get-ChildItem (Join-Path $env:APPDATA 'MetaQuotes\Terminal') -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'MQL5\Include' }
          foreach ($s in $sources) {
            if (Test-Path (Join-Path $s 'Trade\Trade.mqh')) {
              New-Item -ItemType Directory -Force -Path $target | Out-Null
              Copy-Item -Path (Join-Path $s '*') -Destination $target -Recurse -Force
              Write-Host "Copied standard library from $s"
              exit 0
            }
          }
          Write-Warning 'MQL5 standard library unavailable on this runner'

      # Reuse ticks/rates downloaded by the dataprep workflow so backtests do
      # not re-download a year of real ticks on every run.
      - name: Restore downloaded data cache
        uses: actions/cache@v4
        with:
          path: |
            C:\mt5\bases
            C:\mt5\Tester
          key: mt5data-XAUUSD.m-365-v1
          restore-keys: |
            mt5data-XAUUSD.m-
            mt5data-

      - name: Resolve MT5 paths
        shell: pwsh
        run: |
          $terminal = Join-Path $env:MT5_DIR 'terminal64.exe'
          $metaeditor = Join-Path $env:MT5_DIR 'metaeditor64.exe'
          if (-not (Test-Path $terminal))   { Write-Error "terminal64.exe missing in $env:MT5_DIR"; exit 1 }
          if (-not (Test-Path $metaeditor)) { Write-Error "metaeditor64.exe missing in $env:MT5_DIR"; exit 1 }
          "TERMINAL=$terminal"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "METAEDITOR=$metaeditor" | Out-File -FilePath $env:GITHUB_ENV -Append
          # /portable keeps the data folder inside the install directory
          $experts = Join-Path $env:MT5_DIR 'MQL5\Experts'
          New-Item -ItemType Directory -Force -Path $experts | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:MT5_DIR 'MQL5\Files') | Out-Null
          "EXPERTS_DIR=$experts" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Copy expert source
        shell: pwsh
        run: |
          if (Test-Path "$env:EA_NAME.mq5") {
            Copy-Item -Path "$env:EA_NAME.mq5" -Destination (Join-Path $env:EXPERTS_DIR "$env:EA_NAME.mq5") -Force
          }
          if (Test-Path "$env:EA_NAME.ex5") {
            Copy-Item -Path "$env:EA_NAME.ex5" -Destination (Join-Path $env:EXPERTS_DIR "$env:EA_NAME.ex5") -Force
          }
          Get-ChildItem $env:EXPERTS_DIR | Select-Object Name, Length | Format-Table

      - name: Static MQL5 checks
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/mql5_lint.py "$env:EA_NAME.mq5"
          if ($LASTEXITCODE -ne 0) { Write-Error 'Static checks failed.'; exit 1 }

      - name: Compile expert (fail on any error)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'compile.log'
          $src = Join-Path $env:EXPERTS_DIR "$env:EA_NAME.mq5"
          $prebuilt = Join-Path $env:EXPERTS_DIR "$env:EA_NAME.ex5"
          if (-not (Test-Path $src)) {
            if (-not (Test-Path $prebuilt)) { Write-Error 'Neither source nor pre-compiled expert is available.'; exit 1 }
            if ((Get-Item $prebuilt).Length -lt 1024) { Write-Error 'Pre-compiled EX5 looks truncated.'; exit 1 }
            "Pre-compiled expert supplied; MetaEditor compile skipped." | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'compile-artifact.log')
            Write-Host "Using pre-compiled expert: $prebuilt ($((Get-Item $prebuilt).Length) bytes)"
            exit 0
          }
          Write-Host "Compiling $src"
          $p = Start-Process -FilePath $env:METAEDITOR -ArgumentList "/portable","/compile:$src","/log:$log" -Wait -PassThru
          # metaeditor64.exe returns 1 even on a clean build, so the log text and
          # the produced .ex5 are the authoritative signals.
          Write-Host "MetaEditor exit code: $($p.ExitCode) (not authoritative)"
          if (-not (Test-Path $log)) { Write-Error 'Compile log was not produced.'; exit 1 }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host "----- compile log -----"
          Write-Host $text
          Write-Host "-----------------------"
          if ($text -match '(\d+)\s+errors?,\s*(\d+)\s+warnings?') {
            if ([int]$Matches[1] -gt 0) { Write-Error "Compilation failed with $($Matches[1]) error(s)."; exit 1 }
            Write-Host "Compiler reported $($Matches[1]) errors, $($Matches[2]) warnings."
          } elseif ($text -match '(?im)^.*\berror\b.*$') {
            Write-Error 'Compilation log contains errors.'
            exit 1
          } else {
            Write-Error 'No compiler result line found in the log.'
            exit 1
          }
          $ex5 = Join-Path $env:EXPERTS_DIR "$env:EA_NAME.ex5"
          if (-not (Test-Path $ex5)) { Write-Error 'EX5 was not produced.'; exit 1 }
          if ((Get-Item $ex5).Length -lt 1024) { Write-Error 'EX5 looks truncated.'; exit 1 }
          Copy-Item $log (Join-Path $env:RUNNER_TEMP 'compile-artifact.log') -Force
          Write-Host "Compiled OK: $ex5 ($((Get-Item $ex5).Length) bytes)"

      - name: Resolve gold symbol
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          SYMBOL_OVERRIDE: ${{ inputs.symbol }}
        run: |
          $scan = Join-Path $env:EXPERTS_DIR 'SymbolScan.mq5'
          Copy-Item 'tools/SymbolScan.mq5' $scan -Force
          Start-Process -FilePath $env:METAEDITOR -ArgumentList '/portable',"/compile:$scan","/log:$env:RUNNER_TEMP\scan-compile.log" -Wait | Out-Null
          Start-Sleep -Seconds 2
          $ini = Join-Path $env:MT5_DIR 'scan.ini'
          @(
            '[Common]',
            "Login=$env:MT5_LOGIN",
            "Password=$env:MT5_PASSWORD",
            "Server=$env:MT5_SERVER",
            'KeepPrivate=0',
            '[StartUp]',
            'Expert=SymbolScan.ex5'
          ) | Set-Content -Path $ini -Encoding ASCII

          Start-Process -FilePath $env:TERMINAL -ArgumentList '/portable',"/config:$ini" | Out-Null
          $csv = $null
          foreach ($cand in @((Join-Path $env:MT5_DIR 'Common\Files\symbols.csv'),
                              (Join-Path $env:APPDATA 'MetaQuotes\Terminal\Common\Files\symbols.csv'))) {
            for ($i = 0; $i -lt 40; $i++) {
              if ((Test-Path $cand) -and ((Get-Item $cand).Length -gt 0)) { $csv = $cand; break }
              Start-Sleep -Seconds 3
            }
            if ($csv) { break }
          }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $logs = Get-ChildItem (Join-Path $env:MT5_DIR 'logs') -Filter '*.log' -ErrorAction SilentlyContinue
          foreach ($l in $logs) { Write-Host "=== $($l.Name) ==="; Get-Content $l.FullName -Tail 40 }

          if (-not $csv) {
            Write-Error 'Symbol scan produced no CSV: the terminal did not log in or never synced symbols.'
            exit 1
          }
          Copy-Item $csv (Join-Path $env:RUNNER_TEMP 'symbols.csv') -Force
          $rows = Import-Csv -Path $csv -Delimiter ';'
          Write-Host "terminal knows $($rows.Count) symbols"

          $chosen = $env:SYMBOL_OVERRIDE
          if (-not $chosen) {
            $gold = $rows | Where-Object { $_.name -match 'XAU' -or $_.path -match 'Gold|Metals' -or $_.description -match 'Gold' }
            $gold | Select-Object -First 25 name, description, path, spread_pts | Format-Table -AutoSize | Out-String | Write-Host
            $pick = $gold | Where-Object { $_.name -match '^XAUUSD' } | Sort-Object { $_.name.Length } | Select-Object -First 1
            if (-not $pick) { $pick = $gold | Select-Object -First 1 }
            if ($pick) { $chosen = $pick.name }
          }
          if (-not $chosen) {
            Write-Error 'No gold symbol found in the terminal symbol tree.'
            exit 1
          }
          Write-Host "Using symbol: $chosen"
          "SYMBOL=$chosen" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The install cache carries the previous run's Common/Files and Tester
      # output; appending to them silently mixes two runs in one report.
      - name: Purge previous run state
        shell: pwsh
        run: |
          # FILE_COMMON resolves to the roaming Common\Files folder, not the
          # install tree, so both have to be cleared.
          $roaming = Join-Path $env:APPDATA 'MetaQuotes\Terminal\Common\Files'
          foreach ($dir in @($roaming, "$env:MT5_DIR\Common\Files", "$env:MT5_DIR\Tester", "$env:MT5_DIR\MQL5\Files")) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue }
          }
          New-Item -ItemType Directory -Force -Path "$env:MT5_DIR\Common\Files" | Out-Null

      - name: Build tester.ini
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          DAYS: ${{ inputs.days || '30' }}
          MODEL: ${{ inputs.model || '4' }}
          EXECMODE: ${{ inputs.execution_mode || '50' }}
          TO_DATE: ${{ inputs.to_date }}
          OPT: ${{ inputs.optimize || '0' }}
          OPTCRIT: ${{ inputs.opt_criterion || '12' }}
        run: |
          if ($env:TO_DATE -ne '') {
            $to = [datetime]::ParseExact($env:TO_DATE, 'yyyy-MM-dd', $null)
          } else {
            $to = (Get-Date).Date.AddDays(-1)
          }
          $from = $to.AddDays(-[int]$env:DAYS)
          $ini = Join-Path $env:MT5_DIR 'tester.ini'
          $report = Join-Path $env:MT5_DIR 'report'
          $lines = @(
            '[Common]',
            "Login=$env:MT5_LOGIN",
            "Password=$env:MT5_PASSWORD",
            "Server=$env:MT5_SERVER",
            'KeepPrivate=0',
            '[Tester]',
            "Expert=$env:EA_NAME.ex5",
            "Symbol=$env:SYMBOL",
            "Period=$env:PERIOD",
            "Model=$env:MODEL",
            "ExecutionMode=$env:EXECMODE",
            "Optimization=$env:OPT",
            'ForwardMode=0',
            "Deposit=${{ github.event.inputs.deposit || '10' }}",
            'Currency=USD',
            'Leverage=1:3000',
            "FromDate=$($from.ToString('yyyy.MM.dd'))",
            "ToDate=$($to.ToString('yyyy.MM.dd'))",
            "Report=$report.htm",
            'ReplaceReport=1',
            'Visual=0',
            'ShutdownTerminal=0'
          )
          if ($env:OPT -ne '0') { $lines += "OptimizationCriterion=$env:OPTCRIT" }
          if ($env:SET_FILE -ne '') {
            $setSrc = Join-Path $env:GITHUB_WORKSPACE $env:SET_FILE
            if (Test-Path $setSrc) {
              $prof = Join-Path $env:MT5_DIR 'MQL5\Profiles\Tester'
              New-Item -ItemType Directory -Force -Path $prof | Out-Null
              Copy-Item $setSrc (Join-Path $prof $env:SET_FILE) -Force
              $lines += "ExpertParameters=$env:SET_FILE"
              Write-Host "Expert parameters file: $env:SET_FILE"
            } else { Write-Warning "set file not found: $setSrc" }
          }
          if ($env:SPREAD_PTS -ne '') { $lines += "Spread=$env:SPREAD_PTS" }
          if ($env:INPUT_RISK -ne '' -or $env:INPUT_POS -ne '' -or $env:INPUT_EXTRA -ne '') {
            $lines += '[TesterInputs]'
            if ($env:INPUT_RISK -ne '') { $lines += "InpMaxAccountRiskPct=$env:INPUT_RISK" }
            if ($env:INPUT_POS -ne '') { $lines += "InpMaxConcurrentPositions=$env:INPUT_POS" }
            if ($env:INPUT_EXTRA -ne '') { $env:INPUT_EXTRA.Split(',') | ForEach-Object { if ($_.Trim() -ne '') { $lines += $_.Trim() } } }
          }
          $lines | Set-Content -Path $ini -Encoding ASCII
          $iniRel = Join-Path $env:MT5_DIR 'tester_rel.ini'
          ($lines | ForEach-Object { if ($_ -match '^Report=') { 'Report=report' } else { $_ } }) | Set-Content -Path $iniRel -Encoding ASCII
          "TESTER_INI_REL=$iniRel" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "----- tester.ini (password masked) -----"
          Get-Content $ini | ForEach-Object { $_ -replace '^Password=.*', 'Password=***' }
          "TESTER_INI=$ini" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REPORT_BASE=$report" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run strategy tester (stress mode)
        shell: pwsh
        run: |
          # MT5 sometimes cancels the tick download on a cold start and then
          # aborts with "no history data"; a retry reuses the cached ticks.
          $reportFile = "$env:REPORT_BASE.htm"
          $configs = @($env:TESTER_INI, $env:TESTER_INI_REL)
          for ($attempt = 0; $attempt -lt $configs.Count; $attempt++) {
            if (Test-Path $reportFile) { break }
            Write-Host "===== tester attempt $($attempt+1) using $($configs[$attempt]) ====="
            if ($attempt -gt 0) {
              Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
            }
            $p = Start-Process -FilePath $env:TERMINAL -ArgumentList '/portable', "/config:$($configs[$attempt])" -PassThru
            $deadline = (Get-Date).AddMinutes(22)
            $lastCpu = -1
            $stall = 0
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 15
              if (Test-Path $reportFile) { Write-Host 'HTML report appeared.'; break }
              $p.Refresh()
              $cpu = 0
              try { $cpu = [int]((Get-Process -Id $p.Id).CPU) } catch { }
              if ($cpu -eq $lastCpu) { $stall++ } else { $stall = 0; $lastCpu = $cpu }
              if ($stall -ge 8) { Write-Warning 'CPU idle for 2 minutes; test looks finished.'; break }
            }
            if (-not (Test-Path $reportFile) -and -not $p.HasExited) {
              Write-Host 'Closing terminal gracefully so it can flush the report.'
              try { $p.CloseMainWindow() | Out-Null } catch { }
              for ($i = 0; $i -lt 20; $i++) {
                Start-Sleep -Seconds 2
                if (Test-Path $reportFile -or $p.HasExited) { break }
              }
            }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Write-Host "report present after attempt $($attempt+1): $(Test-Path $reportFile)"
          }
          Write-Host '----- report/csv files produced -----'
          Get-ChildItem -Path $env:MT5_DIR -Include '*.htm','*.html','*.csv','*.xml' -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize

          # A green run without any result file is a silent no-op; fail loudly.
          $summaryCsv = @()
          foreach ($dir in @((Join-Path $env:MT5_DIR 'Common\Files'),
                             (Join-Path $env:MT5_DIR 'MQL5\Files'),
                             (Join-Path $env:APPDATA 'MetaQuotes\Terminal\Common\Files'))) {
            if (Test-Path $dir) {
              $summaryCsv += Get-ChildItem -Path $dir -Filter '*Summary*.csv' -Recurse -ErrorAction SilentlyContinue
            }
          }
          Write-Host "summary files found: $($summaryCsv.Count)"

          if ((-not (Test-Path "$env:REPORT_BASE.htm")) -and ($summaryCsv.Count -eq 0)) {
            Write-Host '----- terminal log tail -----'
            Get-ChildItem (Join-Path $env:MT5_DIR 'logs') -Filter '*.log' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "=== $($_.Name) ==="; Get-Content $_.FullName -Tail 40 }
            Write-Host '----- tester log tail -----'
            Get-ChildItem (Join-Path $env:MT5_DIR 'Tester\logs') -Filter '*.log' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "=== $($_.Name) ==="; Get-Content $_.FullName -Tail 80 }
            Write-Warning "Tester produced no report at $env:REPORT_BASE.htm (continuing so the logs upload)"
          }

      - name: Collect artifacts
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $found = @()
          foreach ($cand in @("$env:REPORT_BASE.htm", "$env:REPORT_BASE.html")) {
            if (Test-Path $cand) { $found += (Get-Item $cand) }
          }
          if ($found.Count -eq 0) {
            $found = @(Get-ChildItem -Path $env:MT5_DIR -Include '*.htm','*.html' -Recurse -ErrorAction SilentlyContinue |
                       Sort-Object LastWriteTime -Descending)
          }
          if ($found.Count -gt 0) {
            Copy-Item $found[0].FullName (Join-Path $out 'backtest_report.htm') -Force
            Write-Host "Report collected: $($found[0].FullName) ($($found[0].Length) bytes)"
          } else {
            Write-Warning "No HTML report anywhere under $env:MT5_DIR"
            Get-ChildItem -Path $env:MT5_DIR -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.htm','.html','.xml' } |
              Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          }
          foreach ($dir in @((Join-Path $env:MT5_DIR 'Common\Files'), (Join-Path $env:MT5_DIR 'MQL5\Files'), (Join-Path $env:MT5_DIR 'Tester'), (Join-Path $env:APPDATA 'MetaQuotes\Terminal\Common\Files'))) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Filter '*.csv' -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName (Join-Path $out $_.Name) -Force }
            }
          }
          foreach ($x in @(Get-ChildItem -Path $env:MT5_DIR -Include '*.xml','*.opt' -Recurse -ErrorAction SilentlyContinue)) {
            Copy-Item $x.FullName (Join-Path $out $x.Name) -Force
          }
          $scan = Join-Path $env:RUNNER_TEMP 'symbols.csv'
          if (Test-Path $scan) { Copy-Item $scan (Join-Path $out 'symbols.csv') -Force }
          $logs = Join-Path $out 'logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          Get-ChildItem -Path $env:MT5_DIR -Include '*.log' -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $logs ($_.Directory.Name + '_' + $_.Name)) -Force -ErrorAction SilentlyContinue }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'compile-artifact.log')) {
            Copy-Item (Join-Path $env:RUNNER_TEMP 'compile-artifact.log') (Join-Path $out 'compile.log') -Force
          }
          Get-ChildItem -Path $out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Analyse results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'artifacts') {
            python tools/analyze_backtest.py --iteration "${{ inputs.tag || github.run_number }}" --out artifacts/metrics.json
          } else {
            Write-Warning 'No artifacts directory to analyse.'
          }

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ inputs.tag || github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
